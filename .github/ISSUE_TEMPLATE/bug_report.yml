name: Bug report
description: Report a reproducible addon problem
title: "[Bug] "
body:
  - type: textarea
    id: versions
    attributes:
      label: Exact versions
      description: Include Minecraft, NeoForge, Mekanism, Iron's Spellbooks, and this addon.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Include installed units, output settings, energy level, and spell.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Actual result and sanitized logs
      description: Remove tokens, player identifiers, private addresses, and personal paths.
    validations:
      required: true
